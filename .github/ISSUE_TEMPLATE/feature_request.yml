name: Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请尽量说明使用场景，而不只是功能名称。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 当前哪里不方便？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 相关平台
      multiple: true
      options:
        - aiocqhttp (OneBot v11)
        - qq_official (QQ 官方机器人)
        - 全部平台
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
